# NOTE: this file intentionally holds ONLY [tool.*] config, scoped for
# invocations with a working directory inside workflow_orchestrator/.
# Packaging metadata (dependencies, [project.scripts], build-system) lives
# in exactly one place: the pyproject.toml at the repo root. Two competing
# [project] tables previously existed here and had drifted out of sync
# (missing playwright, unconditional pywinauto, stale versions) -- removed
# rather than re-synced, since a package should not define its own
# packaging metadata separately from the repo root.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
exclude = [
    "tests/",
]

[tool.ruff]
line-length = 120
target-version = "py312"
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.coverage.run]
source = ["workflow_orchestrator"]
omit = ["*/tests/*", "*/migrations/*"]
